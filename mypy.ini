# Mypy gate for the Midnite Solar integration, modelled on Home Assistant
# core's own [mypy] section (core dev, mypy 2.3.1) with two honest
# differences, each recorded rather than silent:
#
#   * python_executable points at the bench venv (ha-env) so mypy resolves
#     `homeassistant.*` against the REAL installed Home Assistant (it ships
#     py.typed) instead of a stub package - the integration is checked
#     against the runtime it actually runs on.
#   * the disallow_* rungs are staged (see LADDER below) because core earns
#     them one integration at a time via its generated per-component list;
#     a custom integration starts the same climb here. `check_untyped_defs`
#     is ON from day one: it type-CHECKS every function body even without
#     annotations, which is where the real bugs hide - the annotations are
#     paperwork, the bodies are behaviour.
#
# LADDER (fix all errors of a rung, then flip its flag in this file):
#   rung 1 (now): check_untyped_defs, strict_equality, no_implicit_optional,
#                 warn_redundant_casts, warn_unused_ignores, warn_unreachable
#   rung 2:     disallow_incomplete_defs, disallow_untyped_defs
#   rung 3:     disallow_untyped_calls, disallow_subclassing_any,
#               warn_return_any, disallow_any_generics
# Core additionally runs plugins (pydantic, enum_identity_compare) and
# mypy_path=stubs; neither applies to this repo and neither is faked.

[mypy]
python_version = 3.14
platform = linux
python_executable = /Users/randy/midnite/ha-env/venv/bin/python
files = custom_components/midnite_solar
follow_imports = silent
strict_equality = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
enable_error_code = ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
# rung 2 (flip to true when the codebase is clean of these):
disallow_incomplete_defs = false
disallow_untyped_defs = false
# rung 3:
disallow_untyped_calls = false
disallow_subclassing_any = false
warn_return_any = false
